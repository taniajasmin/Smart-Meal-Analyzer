<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Entry - Chomp Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-section {
            background: linear-gradient(135deg, #4CAF50, #2196F3);
            color: white;
            padding: 4rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .btn-custom {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            margin-top: 10px;
            width: 100%;
        }
        .btn-custom:hover {
            background-color: #45a049;
            color: white;
        }
        .btn-add {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            margin: 10px 0;
        }
        .btn-add:hover {
            background-color: #1976D2;
            color: white;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 mx-auto text-center">
                    <h1 class="display-4 mb-4">Manual Entry</h1>
                    <p class="lead">Enter your meal details below</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body p-4">
                        <form method="POST">
                            <div class="mb-3">
                                <label for="meal_name" class="form-label">Meal Name</label>
                                <input type="text" class="form-control" id="meal_name" name="meal_name" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="serving_size" class="form-label">Serving Size (grams)</label>
                                <input type="number" class="form-control" id="serving_size" name="serving_size" value="100">
                            </div>

                            <div id="ingredients">
                                <h5 class="mb-3">Ingredients</h5>
                                <div class="ingredient-entry mb-3">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <input type="text" class="form-control" name="ingredient_name_0" placeholder="Ingredient name" required>
                                        </div>
                                        <div class="col-md-6">
                                            <input type="text" class="form-control" name="ingredient_qty_0" placeholder="Quantity (e.g., 100g)" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="button" class="btn btn-add" onclick="addIngredient()">
                                Add Another Ingredient
                            </button>

                            <button type="submit" class="btn btn-custom">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ingredientCount = 1;
        
        function addIngredient() {
            const container = document.getElementById('ingredients');
            const newDiv = document.createElement('div');
            newDiv.className = 'ingredient-entry mb-3';
            newDiv.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" class="form-control" name="ingredient_name_${ingredientCount}" placeholder="Ingredient name" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" name="ingredient_qty_${ingredientCount}" placeholder="Quantity (e.g., 100g)" required>
                    </div>
                </div>
            `;
            container.appendChild(newDiv);
            ingredientCount++;
        }
    </script>
</body>
</html>
