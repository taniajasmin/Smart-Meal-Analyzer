<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Chomp Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-section {
            background: linear-gradient(135deg, #4CAF50, #2196F3);
            color: white;
            padding: 4rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .btn-custom {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            margin-top: 10px;
            width: 100%;
        }
        .btn-custom:hover {
            background-color: #45a049;
            color: white;
        }
        .form-label {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 mx-auto text-center">
                    <h1 class="display-4 mb-4">Your Profile</h1>
                    <p class="lead">Complete your profile for a personalized meal plan</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body p-4">
                        <form method="POST">
                            <div class="mb-3">
                                <label for="gender" class="form-label">Gender</label>
                                <select class="form-select" name="gender" id="gender" required>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="dob" name="dob" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-8">
                                    <label for="height" class="form-label">Height</label>
                                    <input type="text" class="form-control" id="height" name="height" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="height_unit" class="form-label">Unit</label>
                                    <select class="form-select" name="height_unit" required>
                                        <option value="cm">cm</option>
                                        <option value="ft">ft</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-8">
                                    <label for="weight" class="form-label">Weight</label>
                                    <input type="text" class="form-control" id="weight" name="weight" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="weight_unit" class="form-label">Unit</label>
                                    <select class="form-select" name="weight_unit" required>
                                        <option value="kg">kg</option>
                                        <option value="lbs">lbs</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="activity_level" class="form-label">Activity Level</label>
                                <select class="form-select" name="activity_level" id="activity_level" required>
                                    <option value="Sedentary">Sedentary</option>
                                    <option value="Lightly Active">Lightly Active</option>
                                    <option value="Moderately Active">Moderately Active</option>
                                    <option value="Very Active">Very Active</option>
                                    <option value="Extra Active">Extra Active</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="fitness_goal" class="form-label">Fitness Goal</label>
                                <select class="form-select" name="fitness_goal" id="fitness_goal" required>
                                    <option value="Weight Loss">Weight Loss</option>
                                    <option value="Muscle Gain">Muscle Gain</option>
                                    <option value="Maintenance">Maintenance</option>
                                    <option value="General Fitness">General Fitness</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="vegan_preference" class="form-label">Dietary Preference</label>
                                <select class="form-select" name="vegan_preference" id="vegan_preference" required>
                                    <option value="no">Regular Diet</option>
                                    <option value="yes">Vegan</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-custom">Generate Meal Plan</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
